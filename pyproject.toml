[project]
name = "OffsideAI"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # LangGraph
    "langgraph>=0.2.0",
    "langchain>=1.2.0",
    # Add project dependencies below
    "pandas>=3.0.2",
    "numpy>=2.4.4",
    "scikit-learn>=1.8.0",
    "matplotlib>=3.10.9",
    "seaborn>=0.13.2",
    "pydantic-settings>=2.14.0",
    "langchain-google-genai>=4.2.2",
    "chromadb>=1.5.9",
    "langchain-community>=0.4.1",
    "penaltyblog>=1.10.0",
    "langchain-google-community>=4.0.0",
    # API server
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "typing>=3.10.0.0",
    "dotenv>=0.9.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
]

[project.scripts]
start = "main:main"
dev = "main:main"
